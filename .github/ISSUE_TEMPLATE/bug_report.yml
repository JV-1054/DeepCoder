name: Bug report
description: Something in DeepCoder does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please never paste a key, a token or a real
        conversation payload into an issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The error message and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      description: The command, the configuration and the steps.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.13.0

  - type: textarea
    id: logs
    attributes:
      label: Output of `node deepcoder.cjs --status`
      description: The bridge state and the installed autostarts.
      render: shell
