# DeepCoder route for the DeepSeek Harness
#
# The harness keeps its profile patch at:
#   $DSH_HOME/profiles/<profile>/cordis.patch.yml
# On Windows that is normally:
#   C:\Users\<you>\.dsh\profiles\desktop\cordis.patch.yml
#
# The file is a YAML ARRAY. Every route is one entry that starts with "- id:".
#
# If the file already holds an llm-pi-ai entry, copy ONLY the "deepcoder:"
# provider block into its providers map. Do not add a second llm-pi-ai entry:
# a later entry of the same id replaces the earlier one and the providers of
# the first entry would disappear. The same holds for agent-default-model,
# which is left untouched so an existing default model keeps working.
#
# The same text is produced by:   node deepcoder.cjs --print-dsh-profile
# and can be written for you by:  node deepcoder.cjs --install-dsh-profile
# which merges the provider into the file in place.
#
# The harness reads the API key from the environment variable AGENTROUTER_API_KEY,
# so set it once for the user and restart the harness:
#   setx AGENTROUTER_API_KEY "sk-..."

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      deepcoder:
        displayName: DeepCoder
        apiKeyEnv: AGENTROUTER_API_KEY
        api: openai-responses
        baseURL: http://127.0.0.1:8899/v1
        timeoutMs: 600000
        streamIdleTimeoutMs: 600000
        models:
          - id: "gpt-6.1-sol"
            name: "GPT-6.1-SOL"
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              off: "none"
              minimal: "minimal"
              low: "low"
              medium: "medium"
              high: "high"
              xhigh: "xhigh"
              max: "max"
        compat:
          supportsDeveloperRole: true
          supportsMaxOutputTokens: true
          supportsStrictMode: false

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepcoder
    model: "gpt-6.1-sol"
    reasoningEffort: high
